<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Student Insurance Tracking System</title>
  <link rel="stylesheet" href="styles.css?v=20260605">
  <link rel="stylesheet" href="assets/css/app.css?v=20260605">
  <link rel="stylesheet" href="assets/css/responsive.css?v=20260605">
</head>
<body class="auth-body">
  <div class="top-bar">
    <div class="top-bar-left">Eastern Visayas State University - Ormoc City Campus</div>
    <div class="top-bar-right">
      <a href="login.html">Login</a>
      <span>|</span>
      <a href="register.html">Register</a>
    </div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-content">
        <h2 class="auth-title">Reset your password</h2>
        <p class="muted step-hint" id="step-hint">Enter your account email to receive a 6-digit verification code.</p>
        <div id="alert-box"></div>

        <!-- Step 1: Email -->
        <form class="auth-form" id="step-email">
          <div class="form-group full-width">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="btn-send-code">SEND CODE</button>
          <p class="auth-footer-text">
            <a href="login.html" class="auth-link">← Back to sign in</a>
          </p>
        </form>

        <!-- Step 2: Verification code -->
        <form class="auth-form hidden" id="step-code">
          <div class="form-group full-width">
            <label for="verification-code">6-digit verification code <span class="required">*</span></label>
            <input type="text" id="verification-code" class="verification-code-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autocomplete="one-time-code">
            <p class="muted small-text">Code sent to <strong id="email-display"></strong></p>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="btn-verify-code">VERIFY CODE</button>
          <button type="button" class="btn auth-submit" id="btn-resend-code" style="margin-top:8px;">Resend code</button>
          <p class="auth-footer-text">
            <button type="button" class="auth-link-btn" id="btn-change-email">Use a different email</button>
          </p>
        </form>

        <!-- Step 3: New password -->
        <form class="auth-form hidden" id="step-password">
          <div class="form-group full-width password-field">
            <label for="new-password">New password <span class="required">*</span></label>
            <div class="password-input-wrap">
              <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggle-new-password" aria-label="Show password">Show</button>
            </div>
          </div>
          <div class="form-group full-width password-field">
            <label for="confirm-new-password">Confirm new password <span class="required">*</span></label>
            <div class="password-input-wrap">
              <input type="password" id="confirm-new-password" required autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggle-confirm-new-password" aria-label="Show confirm password">Show</button>
            </div>
          </div>
          <p class="muted small-text">At least 8 characters with letters and numbers.</p>
          <button type="submit" class="btn btn-primary auth-submit" id="btn-save-password">SAVE NEW PASSWORD</button>
          <p class="auth-footer-text">
            <a href="login.html" class="auth-link">← Back to sign in</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js?v=20260605"></script>
  <script src="assets/js/auth.js?v=20260605"></script>
  <script>
    API.init().catch(() => {});

    const alertBox = document.getElementById('alert-box');
    const stepHint = document.getElementById('step-hint');
    const stepEmail = document.getElementById('step-email');
    const stepCode = document.getElementById('step-code');
    const stepPassword = document.getElementById('step-password');

    let userEmail = '';
    let resetToken = '';

    function showStep(step) {
      stepEmail.classList.toggle('hidden', step !== 1);
      stepCode.classList.toggle('hidden', step !== 2);
      stepPassword.classList.toggle('hidden', step !== 3);

      if (step === 1) {
        stepHint.textContent = 'Enter your account email to receive a 6-digit verification code.';
      } else if (step === 2) {
        stepHint.textContent = 'Enter the 6-digit code from your Gmail inbox.';
        document.getElementById('email-display').textContent = userEmail;
      } else {
        stepHint.textContent = 'Create and save your new password.';
      }
    }

    function attachToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        btn.textContent = hidden ? 'Hide' : 'Show';
      });
    }
    attachToggle('toggle-new-password', 'new-password');
    attachToggle('toggle-confirm-new-password', 'confirm-new-password');

    document.getElementById('verification-code').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    document.getElementById('btn-change-email').addEventListener('click', () => {
      resetToken = '';
      showStep(1);
    });

    async function sendCode() {
      const btn = document.getElementById('btn-send-code');
      setLoading(btn, true);
      try {
        userEmail = document.getElementById('email').value.trim();
        const res = await API.post('/auth/forgot-password', { email: userEmail });
        showAlert(alertBox, res.message || 'Verification code sent.', 'success');
        document.getElementById('verification-code').value = '';
        showStep(2);
      } catch (err) {
        showAlert(alertBox, err.message || 'Could not send code.', 'danger');
      } finally {
        setLoading(btn, false);
      }
    }

    stepEmail.addEventListener('submit', (e) => {
      e.preventDefault();
      sendCode();
    });

    document.getElementById('btn-resend-code').addEventListener('click', () => sendCode());

    stepCode.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-verify-code');
      setLoading(btn, true);
      try {
        const res = await API.post('/auth/verify-reset-code', {
          email: userEmail,
          code: document.getElementById('verification-code').value.trim(),
        });
        resetToken = res.data?.reset_token || '';
        if (!resetToken) {
          throw new Error('Verification succeeded but reset session is missing. Try again.');
        }
        showAlert(alertBox, res.message || 'Code verified.', 'success');
        showStep(3);
      } catch (err) {
        showAlert(alertBox, err.message || 'Invalid code.', 'danger');
      } finally {
        setLoading(btn, false);
      }
    });

    stepPassword.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save-password');
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-new-password').value;
      if (password !== confirm) {
        showAlert(alertBox, 'Passwords do not match.', 'danger');
        return;
      }
      setLoading(btn, true);
      try {
        const res = await API.post('/auth/reset-password', {
          email: userEmail,
          reset_token: resetToken,
          password,
          confirm_password: confirm,
        });
        showAlert(alertBox, res.message || 'Password saved.', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (err) {
        showAlert(alertBox, err.message || 'Could not save password.', 'danger');
      } finally {
        setLoading(btn, false);
      }
    });

    showStep(1);
  </script>
</body>
</html>
